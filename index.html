<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h1 { color: #007bff; }
        .info { margin-bottom: 15px; }
        .label { font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Personal Profile</h1>
        <div class="info"><span class="label">Name:</span> John Doe</div>
        <div class="info"><span class="label">Register Number:</span> REG1234567</div>
        <div class="info"><span class="label">Department:</span> Information Technology</div>
        <div class="info"><span class="label">Skills:</span> Git, Docker, Kubernetes, DevOps, Agile</div>
        <div class="info"><span class="label">Career Objective:</span> To leverage my DevOps and cloud engineering skills to build scalable, automated, and highly available application infrastructures.</div>
    </div>
</body>
</html>
